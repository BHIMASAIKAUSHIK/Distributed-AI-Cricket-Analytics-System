# ================= Server =================
server.port=8080
spring.application.name=cricket-analytics

# ================= H2 Datasource =================
# IMPORTANT: Spring creates this DataSource FIRST, runs schema.sql,
# THEN AkkaConfig creates the ActorSystem (DataSource is a bean parameter).
# This guarantees event_journal + snapshot tables exist before Akka connects.
spring.datasource.url=jdbc:h2:file:./data/akkadb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Always run schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 web console (demo: visual proof of persisted events)
# Open at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================= Ollama (local LLM) =================
ollama.base-url=http://localhost:11434
ollama.model=llama3.2
ollama.timeout-seconds=120

# ================= Akka =================
akka.node.port=2551
akka.ask.timeout-seconds=60

# ================= Actuator =================
management.endpoints.web.exposure.include=health,info
