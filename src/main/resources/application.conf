akka {

  actor {
    provider = cluster

    serializers {
      jackson-json = "akka.serialization.jackson.JacksonJsonSerializer"
    }

    # Every class crossing actor/cluster boundaries implements
    # com.cricket.CricketSerializable -> serialized as JSON
    serialization-bindings {
      "com.cricket.CricketSerializable" = jackson-json
    }
  }

  remote {
    artery {
      transport = tcp
      canonical.hostname = "127.0.0.1"
      canonical.port = 2551
    }
  }

  cluster {
    seed-nodes = [
      "akka://CricketAnalyticsSystem@127.0.0.1:2551",
      "akka://CricketAnalyticsSystem@127.0.0.1:2552"
    ]

    # Fault tolerance: KeepMajority Split Brain Resolver
    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver {
      active-strategy = keep-majority
    }
  }

  persistence {
    journal.plugin = "jdbc-journal"
    snapshot-store.plugin = "jdbc-snapshot-store"
    auto-start-journals = ["jdbc-journal"]
    auto-start-snapshot-stores = ["jdbc-snapshot-store"]
  }
}

# ================= JDBC Journal (H2 via Slick) =================
jdbc-journal {
  slick = ${slick}
}

jdbc-snapshot-store {
  slick = ${slick}
}

jdbc-read-journal {
  slick = ${slick}
}

slick {
  profile = "slick.jdbc.H2Profile$"
  db {
    url = "jdbc:h2:file:./data/akkadb;AUTO_SERVER=TRUE"
    user = "sa"
    password = ""
    driver = "org.h2.Driver"
    connectionPool = disabled
    keepAliveConnection = true
  }
}
